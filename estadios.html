<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedes y Estadios - Galindo 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-stadium-dark text-white">

    <div id="stadium-nav"></div>

    <header class="container text-center pt-5 mt-5">
        <div class="pt-5">
            <span class="badge-soccer mb-2">🏟️ LOS COLOSOS DEL NORTE</span>
            <h1 class="display-4 fw-bold font-big-soccer m-0">SEDES OFICIALES</h1>
            <div class="spacer-line-soccer mx-auto my-3"></div>
            
            <div class="d-flex justify-content-center flex-wrap gap-2 mt-4">
                <button class="btn btn-soccer-filter active" data-filter="all">Todos</button>
                <button class="btn btn-soccer-filter" data-filter="mex">🇲🇽 México</button>
                <button class="btn btn-soccer-filter" data-filter="usa">🇺🇸 USA</button>
                <button class="btn btn-soccer-filter" data-filter="can">🇨🇦 Canadá</button>
            </div>
        </div>
    </header>

    <main class="container my-5 pb-5">
        <div class="row g-4" id="stadiums-grid">

            <div class="col-lg-4 col-md-6 stadium-card-box mex">
                <div class="card card-stadium-soccer border-0 overflow-hidden h-100">
                    <div class="stadium-img-wrap">
                        <img src="img/azteca.jpg" alt="Estadio Azteca" class="stadium-img">
                        <span class="stadium-badge-country badge-mex">México</span>
                    </div>
                    <div class="card-body p-4">
                        <h4 class="stadium-title mb-2">Estadio Azteca</h4>
                        <p class="text-light-50 small mb-1">📍 <strong>Ciudad:</strong> Ciudad de México</p>
                        <p class="text-light-50 small mb-0">👥 <strong>Capacidad:</strong> 87,523 espectadores</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 stadium-card-box usa">
                <div class="card card-stadium-soccer border-0 overflow-hidden h-100">
                    <div class="stadium-img-wrap">
                        <img src="img/sofi.jpg" alt="SoFi Stadium" class="stadium-img">
                        <span class="stadium-badge-country badge-usa">USA</span>
                    </div>
                    <div class="card-body p-4">
                        <h4 class="stadium-title mb-2">SoFi Stadium</h4>
                        <p class="text-light-50 small mb-1">📍 <strong>Ciudad:</strong> Los Ángeles</p>
                        <p class="text-light-50 small mb-0">👥 <strong>Capacidad:</strong> 70,240 espectadores</p>
                    </div>
                </div>
            </div>

            <div class="col-lg-4 col-md-6 stadium-card-box can">
                <div class="card card-stadium-soccer border-0 overflow-hidden h-100">
                    <div class="stadium-img-wrap">
                        <img src="img/bmo.jpg" alt="BMO Field" class="stadium-img">
                        <span class="stadium-badge-country badge-can">Canadá</span>
                    </div>
                    <div class="card-body p-4">
                        <h4 class="stadium-title mb-2">BMO Field</h4>
                        <p class="text-light-50 small mb-1">📍 <strong>Ciudad:</strong> Toronto</p>
                        <p class="text-light-50 small mb-0">👥 <strong>Capacidad:</strong> 45,736 espectadores</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
